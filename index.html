<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scientific Notation Practice Quiz</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent2:#1d4ed8;
    --good:#15803d;
    --goodbg:#ecfdf5;
    --bad:#b91c1c;
    --badbg:#fef2f2;
    --border:#dbe3ee;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(15,23,42,.08);
    padding:28px;
  }
  h1{
    margin:0 0 8px;
    font-size:2rem;
  }
  .subtitle{
    color:var(--muted);
    margin-bottom:22px;
    line-height:1.5;
  }
  .progressbar{
    height:10px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
    margin:12px 0 22px;
  }
  .progress{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .25s ease;
  }
  .qmeta{
    display:flex;
    justify-content:space-between;
    gap:12px;
    color:var(--muted);
    font-size:.95rem;
    margin-bottom:12px;
  }
  .question{
    font-size:1.35rem;
    line-height:1.45;
    font-weight:700;
    margin-bottom:18px;
  }
  .choices{
    display:grid;
    gap:12px;
  }
  button.choice{
    width:100%;
    text-align:left;
    padding:14px 16px;
    border:2px solid var(--border);
    border-radius:12px;
    background:#fff;
    color:var(--text);
    font-size:1rem;
    cursor:pointer;
    transition:.15s ease;
  }
  button.choice:hover:not(:disabled){
    border-color:#93c5fd;
    background:#eff6ff;
  }
  button.choice:disabled{cursor:default}
  button.choice.correct{
    border-color:var(--good);
    background:var(--goodbg);
  }
  button.choice.incorrect{
    border-color:var(--bad);
    background:var(--badbg);
  }
  .feedback{
    margin-top:18px;
    border-radius:12px;
    padding:16px;
    line-height:1.55;
    display:none;
  }
  .feedback.good{
    display:block;
    background:var(--goodbg);
    border:1px solid #86efac;
  }
  .feedback.bad{
    display:block;
    background:var(--badbg);
    border:1px solid #fca5a5;
  }
  .feedback strong{display:block;margin-bottom:6px}
  .next-btn,.restart-btn{
    margin-top:18px;
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-size:1rem;
    font-weight:700;
    background:var(--accent);
    color:white;
    cursor:pointer;
  }
  .next-btn:hover,.restart-btn:hover{background:var(--accent2)}
  .next-btn{display:none}
  .result-score{
    font-size:3rem;
    font-weight:800;
    margin:10px 0 4px;
  }
  .result-message{
    font-size:1.1rem;
    margin-bottom:18px;
  }
  .review{
    margin-top:24px;
    text-align:left;
  }
  .review-item{
    border-top:1px solid var(--border);
    padding:14px 0;
    line-height:1.45;
  }
  .review-item:first-child{border-top:0}
  .small{font-size:.92rem;color:var(--muted)}
  .hidden{display:none}
  @media (max-width:600px){
    .wrap{padding:12px}
    .card{padding:20px}
    h1{font-size:1.6rem}
    .question{font-size:1.18rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="quizCard">
    <div id="quizView">
      <h1>Scientific Notation Practice Quiz</h1>
      <div class="subtitle">
        20 questions covering scientific notation, standard notation, coefficients, powers of 10,
        and positive/negative exponents.
      </div>

      <div class="qmeta">
        <span id="questionNumber"></span>
        <span id="scoreLive">Score: 0</span>
      </div>
      <div class="progressbar"><div class="progress" id="progress"></div></div>

      <div class="question" id="question"></div>
      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">Next Question</button>
    </div>

    <div id="resultView" class="hidden">
      <h1>Quiz Complete</h1>
      <div class="result-score" id="finalScore"></div>
      <div class="result-message" id="resultMessage"></div>
      <button class="restart-btn" id="restartBtn">Try Again</button>
      <div class="review" id="review"></div>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    q: "Which number is written correctly in scientific notation?",
    choices: ["45 × 10³", "4.5 × 10³", "0.45 × 10⁴", "4500 × 10⁰"],
    answer: 1,
    explanation: "Scientific notation must have a coefficient that is at least 1 but less than 10. Only 4.5 × 10³ meets that rule."
  },
  {
    q: "What is the coefficient in 7.2 × 10⁵?",
    choices: ["7.2", "10", "5", "10⁵"],
    answer: 0,
    explanation: "The coefficient is the first number in scientific notation. In 7.2 × 10⁵, the coefficient is 7.2."
  },
  {
    q: "Convert 63,000 to scientific notation.",
    choices: ["6.3 × 10³", "6.3 × 10⁴", "6.3 × 10⁵", "6.3 × 10⁻⁴"],
    answer: 1,
    explanation: "Move the decimal 4 places left: 63,000 → 6.3. Since the original number is greater than 1, the exponent is positive: 6.3 × 10⁴."
  },
  {
    q: "Convert 4,580,000 to scientific notation.",
    choices: ["4.58 × 10⁵", "4.58 × 10⁶", "4.58 × 10⁷", "45.8 × 10⁵"],
    answer: 1,
    explanation: "The decimal moves 6 places left to make 4.58, so the correct answer is 4.58 × 10⁶."
  },
  {
    q: "Convert 0.0039 to scientific notation.",
    choices: ["3.9 × 10³", "3.9 × 10⁻²", "3.9 × 10⁻³", "39 × 10⁻⁴"],
    answer: 2,
    explanation: "Move the decimal 3 places right to get 3.9. Because the original number is less than 1, the exponent is negative: 3.9 × 10⁻³."
  },
  {
    q: "Convert 0.000072 to scientific notation.",
    choices: ["7.2 × 10⁻⁵", "7.2 × 10⁻⁴", "7.2 × 10⁵", "72 × 10⁻⁶"],
    answer: 0,
    explanation: "Move the decimal 5 places right to get 7.2. A small number less than 1 uses a negative exponent, so 7.2 × 10⁻⁵."
  },
  {
    q: "Convert 8.1 × 10⁴ to standard notation.",
    choices: ["810", "8,100", "81,000", "810,000"],
    answer: 2,
    explanation: "A positive exponent of 4 means move the decimal 4 places right: 8.1 → 81,000."
  },
  {
    q: "Convert 3.45 × 10⁶ to standard notation.",
    choices: ["345,000", "3,450,000", "34,500,000", "0.00000345"],
    answer: 1,
    explanation: "Move the decimal 6 places right: 3.45 × 10⁶ = 3,450,000."
  },
  {
    q: "Convert 6.2 × 10⁻³ to standard notation.",
    choices: ["0.0062", "0.062", "0.00062", "6200"],
    answer: 0,
    explanation: "A negative exponent means move the decimal left. Three places left from 6.2 gives 0.0062."
  },
  {
    q: "Convert 9.04 × 10⁻⁵ to standard notation.",
    choices: ["0.0000904", "0.000904", "0.00904", "90,400"],
    answer: 0,
    explanation: "Move the decimal 5 places left: 9.04 → 0.0000904."
  },
  {
    q: "A number greater than 1 is converted from standard notation to scientific notation. What sign will the exponent usually have?",
    choices: ["Positive", "Negative", "No sign", "It must be zero"],
    answer: 0,
    explanation: "For numbers greater than 1, the decimal is moved left to form the coefficient, so the exponent is positive."
  },
  {
    q: "A number between 0 and 1 is converted to scientific notation. What sign will the exponent have?",
    choices: ["Positive", "Negative", "No sign", "It must be zero"],
    answer: 1,
    explanation: "Small decimals between 0 and 1 use negative exponents in scientific notation."
  },
  {
    q: "Which coefficient could be used in correct scientific notation?",
    choices: ["0.8", "8", "18", "80"],
    answer: 1,
    explanation: "A scientific notation coefficient must be at least 1 but less than 10. The only valid choice is 8."
  },
  {
    q: "Convert 1,200 to scientific notation.",
    choices: ["1.2 × 10²", "1.2 × 10³", "12 × 10²", "1.2 × 10⁻³"],
    answer: 1,
    explanation: "Move the decimal 3 places left: 1,200 → 1.2, so the answer is 1.2 × 10³."
  },
  {
    q: "Convert 0.0015 to scientific notation.",
    choices: ["1.5 × 10⁻²", "1.5 × 10⁻³", "1.5 × 10³", "15 × 10⁻⁴"],
    answer: 1,
    explanation: "Move the decimal 3 places right to get 1.5. Because the number is less than 1, use a negative exponent: 1.5 × 10⁻³."
  },
  {
    q: "Convert 5.82 × 10⁵ to standard notation.",
    choices: ["58,200", "582,000", "5,820,000", "0.0000582"],
    answer: 1,
    explanation: "Move the decimal 5 places right: 5.82 × 10⁵ = 582,000."
  },
  {
    q: "Convert 2.507 × 10⁻⁴ to standard notation.",
    choices: ["0.0002507", "0.002507", "0.02507", "25,070"],
    answer: 0,
    explanation: "Move the decimal 4 places left: 2.507 → 0.0002507."
  },
  {
    q: "Which expression is NOT written in proper scientific notation?",
    choices: ["3.4 × 10⁶", "9.99 × 10⁻²", "12.5 × 10³", "1.01 × 10⁵"],
    answer: 2,
    explanation: "12.5 is too large to be a scientific notation coefficient. The coefficient must be less than 10."
  },
  {
    q: "Convert 74,300,000 to scientific notation.",
    choices: ["7.43 × 10⁶", "7.43 × 10⁷", "7.43 × 10⁸", "74.3 × 10⁶"],
    answer: 1,
    explanation: "Move the decimal 7 places left to get 7.43, so the answer is 7.43 × 10⁷."
  },
  {
    q: "Convert 6.257 × 10⁻⁷ to standard notation.",
    choices: ["0.000006257", "0.0000006257", "0.00000006257", "6,257,000"],
    answer: 1,
    explanation: "A negative exponent of 7 means move the decimal 7 places left: 6.257 × 10⁻⁷ = 0.0000006257."
  }
];

let current = 0;
let score = 0;
let answered = false;
let results = [];

const qNum = document.getElementById("questionNumber");
const scoreLive = document.getElementById("scoreLive");
const progress = document.getElementById("progress");
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const quizView = document.getElementById("quizView");
const resultView = document.getElementById("resultView");
const finalScore = document.getElementById("finalScore");
const resultMessage = document.getElementById("resultMessage");
const reviewEl = document.getElementById("review");
const restartBtn = document.getElementById("restartBtn");

function renderQuestion(){
  answered = false;
  feedbackEl.className = "feedback";
  feedbackEl.innerHTML = "";
  nextBtn.style.display = "none";

  const item = questions[current];
  qNum.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreLive.textContent = `Score: ${score}`;
  progress.style.width = `${(current / questions.length) * 100}%`;
  questionEl.textContent = item.q;
  choicesEl.innerHTML = "";

  item.choices.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = choice;
    btn.onclick = () => selectAnswer(i, btn);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(index, btn){
  if(answered) return;
  answered = true;

  const item = questions[current];
  const buttons = [...document.querySelectorAll(".choice")];
  buttons.forEach(b => b.disabled = true);

  const isCorrect = index === item.answer;
  if(isCorrect){
    score++;
    btn.classList.add("correct");
    feedbackEl.className = "feedback good";
    feedbackEl.innerHTML = `<strong>Correct!</strong>${item.explanation}`;
  } else {
    btn.classList.add("incorrect");
    buttons[item.answer].classList.add("correct");
    feedbackEl.className = "feedback bad";
    feedbackEl.innerHTML = `<strong>Not quite.</strong>The correct answer is <b>${item.choices[item.answer]}</b>.<br>${item.explanation}`;
  }

  results.push({
    question: item.q,
    selected: item.choices[index],
    correct: item.choices[item.answer],
    isCorrect
  });

  scoreLive.textContent = `Score: ${score}`;
  nextBtn.style.display = "inline-block";
  nextBtn.textContent = current === questions.length - 1 ? "See Results" : "Next Question";
}

nextBtn.addEventListener("click", () => {
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  quizView.classList.add("hidden");
  resultView.classList.remove("hidden");

  const percent = Math.round((score / questions.length) * 100);
  finalScore.textContent = `${score} / ${questions.length} (${percent}%)`;

  let msg = "";
  if(percent >= 90) msg = "Excellent work — you have a strong understanding of scientific notation.";
  else if(percent >= 80) msg = "Nice job — just a few areas need review.";
  else if(percent >= 70) msg = "Good progress — review the missed problems and try again.";
  else msg = "Keep practicing — focus on decimal movement and the sign of the exponent.";
  resultMessage.textContent = msg;

  progress.style.width = "100%";

  const missed = results.filter(r => !r.isCorrect);
  if(missed.length === 0){
    reviewEl.innerHTML = `<div class="review-item"><strong>Perfect score!</strong><div class="small">No missed questions to review.</div></div>`;
  } else {
    reviewEl.innerHTML = `<h2>Review Missed Questions</h2>` + missed.map((r, idx) => `
      <div class="review-item">
        <strong>${idx + 1}. ${r.question}</strong><br>
        <span>Your answer: ${r.selected}</span><br>
        <span>Correct answer: ${r.correct}</span>
      </div>
    `).join("");
  }
}

restartBtn.addEventListener("click", () => {
  current = 0;
  score = 0;
  answered = false;
  results = [];
  resultView.classList.add("hidden");
  quizView.classList.remove("hidden");
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
